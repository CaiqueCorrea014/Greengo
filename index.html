<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GreenGo — Fale em inglês. A IA corrige.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg-edge: #04140e;
  --bg-mid: #072a1d;
  --bg-glow: #0f6a43;
  --text: #f2faf5;
  --text-nav: #a9c9b8;
  --text-muted: #6f9582;
  --mic-light: #aaf1c4;
  --mic-mid: #3fbf86;
  --mic-dark: #08925f;
  --ring: rgba(120, 230, 170, .22);
  --font: "Montserrat", "Helvetica Neue", Arial, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; margin: 0; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  height: 100%;
  min-height: 100%;
  font-family: var(--font);
  color: var(--text);
  background:
    radial-gradient(ellipse 55% 60% at 50% 40%, var(--bg-glow) 0%, var(--bg-mid) 45%, var(--bg-edge) 100%),
    var(--bg-edge);
  overflow: hidden;
  position: relative;
}
body::before {
  content: "";
  position: fixed; inset: 0;
  background: radial-gradient(ellipse 90% 80% at 50% 45%, transparent 40%, rgba(0,0,0,.35) 100%);
  pointer-events: none;
}

.nav {
  position: relative; z-index: 2;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  padding: 24px 32px;
}
.logo { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 500; color: var(--text); text-decoration: none; }
.logo svg { width: 20px; height: 20px; }
.links { display: flex; gap: 44px; }
.links a, .login { color: var(--text-nav); text-decoration: none; font-size: 15px; font-weight: 500; transition: color .2s; }
.links a:hover, .login:hover { color: var(--text); }
.login { justify-self: end; }

.stage {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding-bottom: 6vh;
  text-align: center;
}
.mic-wrap { position: relative; width: 380px; height: 380px; margin-bottom: 10px; }
.mic-wrap::before { content: ""; position: absolute; inset: -12%; border-radius: 50%; background: radial-gradient(circle, rgba(60,220,150,.22) 0%, rgba(60,220,150,.06) 45%, transparent 70%); transition: opacity .4s; }
.mic { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; padding: 0; background: none; cursor: pointer; border-radius: 50%; }
.mic:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
canvas#orb { width: 100%; height: 100%; display: block; }
.tag { margin-top: 6px; font: 500 11px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .28em; color: var(--text-muted); text-transform: uppercase; }
.speaking .tag, .listening .tag { color: #7df0b4; }

h1 { margin-top: 26px; font-size: 26px; font-weight: 500; letter-spacing: .1px; line-height: 1.3; padding: 0 20px; }
.hint { margin-top: 22px; font-size: 15px; font-weight: 400; color: var(--text-muted); min-height: 1.4em; max-width: 520px; padding: 0 20px; }

@media (max-width: 640px) {
  .nav { padding: 18px 20px; }
  .links { gap: 18px; }
  .links a, .login { font-size: 13px; }
  .logo { font-size: 17px; }
  .mic-wrap { width: 300px; height: 300px; }
  h1 { font-size: 21px; }
}
@media (prefers-reduced-motion: reduce) { .ring { animation: none !important; } }
</style>
</head>
<body>
  <header class="nav">
    <a class="logo" href="#" aria-label="GreenGo">
      <svg viewBox="0 0 24 24" fill="#3fd68f" aria-hidden="true"><path d="M2 6c6-1 10 2 10 8v6C5 20 1 14 2 6z"/><path d="M22 4c1 8-3 14-10 16v-6c0-6 4-10 10-10z" opacity=".85"/></svg>
      GreenGo
    </a>
    <nav class="links">
      <a href="#">Treinar</a>
      <a href="#">Sequência</a>
      <a href="#">Outros</a>
    </nav>
    <a class="login" href="#">Entrar</a>
  </header>

  <main class="stage idle" id="stage">
    <div class="mic-wrap">
      <button class="mic" id="mic" aria-label="Começar a conversa" aria-pressed="false"><canvas id="orb"></canvas></button>
    </div>
    <div class="tag" id="tag">standby</div>
    <h1>Fale em inglês. A IA corrige.</h1>
    <p class="hint" id="hint" aria-live="polite">toque para começar</p>
  </main>

<script>
(function () {
  var stage = document.getElementById('stage'), mic = document.getElementById('mic'),
      hint = document.getElementById('hint'), tag = document.getElementById('tag'),
      cv = document.getElementById('orb'), ctx = cv.getContext('2d');
  var state = 'idle', level = 0, amp = 0, spike = 0, rec = null, size = 380, dpr = 1;
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var TTS = window.speechSynthesis;

  /* ---------- orb ---------- */
  var pts = [], N = 1500, i;
  for (i = 0; i < N; i++) {
    var core = i > 1000;
    var u = Math.random() * 2 - 1, th = Math.random() * 6.2832, s = Math.sqrt(1 - u * u);
    var r = core ? Math.pow(Math.random(), .6) * .55 : .86 + Math.random() * .14;
    pts.push({ x: s * Math.cos(th) * r, y: u * r, z: s * Math.sin(th) * r, core: core, k: Math.random() * 6.28, sz: .6 + Math.random() * 1.5 });
  }
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    size = cv.clientWidth || 380;
    cv.width = cv.height = Math.round(size * dpr);
  }
  window.addEventListener('resize', resize); resize();

  var t0 = performance.now(), rot = 0;
  function frame(now) {
    var t = (now - t0) / 1000;
    if (state === 'speaking') {
      level += ((.35 + Math.random() * .65) - level) * .12;
      level = Math.max(level, spike); spike *= .9;
    } else if (state === 'listening') level = .25 + .15 * Math.sin(t * 3.2);
    else level = .04 + .03 * Math.sin(t * .9);
    amp += (level - amp) * .15;
    rot += .003 + amp * .02;

    var W = cv.width, c = W / 2, R = W * .30;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, W);
    ctx.lineWidth = Math.max(1, dpr);

    /* rings */
    var rings = [[1.42, [2, 10], .18, .12], [1.28, [90, 18], .5, -.2], [1.12, [1, 5], .22, .35]];
    rings.forEach(function (q, n) {
      ctx.beginPath(); ctx.setLineDash(q[1].map(function (v) { return v * dpr; }));
      ctx.lineDashOffset = -t * 40 * q[3] * dpr;
      ctx.strokeStyle = 'rgba(120,240,180,' + (q[2] + amp * .35) + ')';
      ctx.arc(c, c, R * q[0] * (1 + amp * .03 * (n + 1)), 0, 6.2832); ctx.stroke();
    });
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.strokeStyle = 'rgba(150,255,200,.8)'; ctx.lineWidth = 2 * dpr;
    ctx.arc(c, c, R * 1.42, t * .5, t * .5 + .9); ctx.stroke();
    ctx.beginPath(); ctx.arc(c, c, R * 1.42, t * .5 + 3.4, t * .5 + 3.8); ctx.stroke();

    /* particles */
    var cr = Math.cos(rot), sr = Math.sin(rot), tilt = .42, ct = Math.cos(tilt), st = Math.sin(tilt);
    var out = [];
    for (i = 0; i < N; i++) {
      var p = pts[i];
      var w = 1 + amp * .22 * Math.sin(p.y * 7 + t * 6 + p.k) + amp * .1 * Math.sin(p.x * 9 - t * 4);
      var x = p.x * w, y = p.y * w, z = p.z * w;
      var x1 = x * cr + z * sr, z1 = -x * sr + z * cr;
      var y1 = y * ct - z1 * st, z2 = y * st + z1 * ct;
      var f = 1 / (1 - z2 * .35);
      out.push([c + x1 * R * f * (1 + amp * .05), c + y1 * R * f, z2, p]);
    }
    out.sort(function (a, b) { return a[2] - b[2]; });
    for (i = 0; i < N; i++) {
      var o = out[i], d = (o[2] + 1) / 2, a2 = .15 + d * .85, q2 = o[3];
      ctx.fillStyle = q2.core ? 'rgba(255,' + (140 + d * 60 | 0) + ',70,' + a2 * .9 + ')' : 'rgba(' + (120 + d * 80 | 0) + ',255,' + (180 + d * 40 | 0) + ',' + a2 + ')';
      var sz = q2.sz * (.6 + d) * dpr * (1 + amp * .4);
      ctx.fillRect(o[0], o[1], sz, sz);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- conversa ---------- */
  function set(st, text, label) {
    state = st;
    stage.className = 'stage ' + (st === 'idle' ? 'idle' : st);
    mic.setAttribute('aria-pressed', String(st !== 'idle'));
    hint.textContent = text; tag.textContent = label;
  }

  function speak(text, done) {
    set('speaking', '“' + text + '”', 'falando');
    var finished = false;
    function end() { if (finished) return; finished = true; done && done(); }
    if (!TTS) { setTimeout(end, 2600); return; }
    try {
      TTS.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = .95;
      u.onboundary = function () { spike = 1; };
      u.onend = end; u.onerror = end;
      TTS.speak(u);
    } catch (e) { setTimeout(end, 2600); }
  }

  function listen() {
    if (!SR) { set('idle', 'seu navegador não reconhece voz — tente o Chrome', 'standby'); return; }
    var heard = '';
    try {
      rec = new SR(); rec.lang = 'en-US'; rec.interimResults = true;
      rec.onresult = function (e) {
        heard = '';
        for (var k = e.resultIndex; k < e.results.length; k++) heard += e.results[k][0].transcript;
        hint.textContent = '“' + heard.trim() + '”';
      };
      rec.onerror = function () { set('idle', 'não consegui acessar o microfone — toque para tentar de novo', 'standby'); };
      rec.onend = function () {
        if (state !== 'listening') return;
        heard.trim() ? speak('You said: ' + heard.trim() + '. Nice job! Say something else.', function () { set('idle', 'toque para continuar', 'standby'); })
                     : set('idle', 'não ouvi nada — toque para tentar de novo', 'standby');
      };
      rec.start(); set('listening', 'ouvindo… fale em inglês', 'ouvindo');
    } catch (e) { set('idle', 'toque para começar', 'standby'); }
  }

  mic.addEventListener('click', function () {
    if (state === 'idle') speak('Hi! Tell me something in English.', listen);
    else {
      try { if (rec) rec.stop(); } catch (e) {}
      try { TTS && TTS.cancel(); } catch (e) {}
      set('idle', 'toque para começar', 'standby');
    }
  });
})();
</script>
</body>
</html>
